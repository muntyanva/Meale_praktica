services:
  # ------------------------
  # PostgreSQL (СУБД)
  # ------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mealie-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"   # порт хоста можно задать в .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Ограничения ресурсов (работают в обычном режиме)
    mem_limit: 512m
    cpus: '0.5'

  # ------------------------
  # Redis (кэш)
  # ------------------------
  redis:
    image: redis:7-alpine
    container_name: mealie-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: '0.2'

  # ------------------------
  # Mealie (основное приложение)
  # ------------------------
  mealie:
    container_name: mealie
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    volumes:
      - mealie-data:/app/data/
    ports:
      - "${MEALIE_EXTERNAL_PORT:-9091}:9000"
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_ENGINE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres          # имя сервиса в compose
      POSTGRES_PORT: 5432                # внутренний порт контейнера
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    cpus: '1.0'

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mealie-data:
    driver: local
